<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout – Mangga Market</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="checkout" class=""><div id="hdr"></div>
<div class="wrap pg"><h1>Checkout</h1><form id="f" novalidate class="lay"><div><div class="box"><h3>Customer information</h3><div class="fg"><label>Full name</label><input id="name" data-v="req"></div><div class="row2"><div class="fg"><label>Email</label><input id="email" type="email" data-v="email"></div><div class="fg"><label>Mobile (+63)</label><input id="phone" data-v="phone" placeholder="+63 9XX XXX XXXX"></div></div></div>
<div class="box"><h3>Delivery address</h3><div class="fg" id="saved" hidden><select></select></div><div class="fg"><label>Street, barangay</label><input id="addr" data-v="req"></div><div class="row2"><div class="fg"><label>City / municipality</label><input id="city" data-v="req"></div><div class="fg"><label>Postal code</label><input id="zip" data-v="zip" inputmode="numeric"></div></div><div class="fg"><label>Region</label><select id="region"></select></div><label><input type="checkbox" id="sv" style="width:auto"> Save this address</label></div>
<div class="box"><h3>Shipping method</h3><label class="opt"><input type="radio" name="ship" value="Standard" checked> Standard (3–7 days)</label><label class="opt"><input type="radio" name="ship" value="Express"> Express (1–3 days) +₱100</label></div>
<div class="box"><h3>Payment method</h3><label class="opt"><input type="radio" name="pay" value="Cash on Delivery" checked> 💵 Cash on Delivery</label><label class="opt"><input type="radio" name="pay" value="GCash"> 📱 GCash</label><label class="opt"><input type="radio" name="pay" value="Bank Transfer"> 🏦 Bank Transfer</label><label class="opt"><input type="radio" name="pay" value="Credit/Debit Card"> 💳 Credit/Debit Card (demo)</label>
<p id="gc" class="sub" hidden>Pay via GCash to 0912 123 111 after placing your order.</p><p id="bk" class="sub" hidden>Transfer to BDO 0000-0000-0000 (Mangga Market) after placing your order.</p><div id="card" hidden><div class="fg"><label>Card number</label><input data-v="card" placeholder="4111 1111 1111 1111"></div><div class="row2"><div class="fg"><label>Expiry</label><input data-v="exp" placeholder="MM/YY"></div><div class="fg"><label>CVV</label><input data-v="cvv" type="password"></div></div><p class="sub">Demo only: nothing is charged or stored.</p></div></div></div>
<div class="box"><h3>Order summary</h3><div id="sum"></div><button class="btn m full" style="margin-top:14px">Place order</button></div></form></div>
<div id="ftr"></div>
<script src="js/app.js"></script><script src="js/cart.js"></script><script src="js/checkout.js"></script></body></html>
